x-strata-unloader: &strata-unloader
  image: python:3.12-slim
  restart: "no"
  command:
    - python3
    - -c
    - |
      import json, os, sys, time, urllib.error, urllib.request

      base = os.environ["TARGET_URL"].rstrip("/")
      key = os.environ["STRATA_API_KEY"].strip()
      auth = {"Authorization": f"Bearer {key}"}

      def get_models():
          req = urllib.request.Request(f"{base}/v1/models", headers=auth)
          with urllib.request.urlopen(req, timeout=10) as resp:
              return json.loads(resp.read().decode("utf-8")).get("data", [])

      def status_of(entry):
          st = entry.get("status")
          val = st.get("value") if isinstance(st, dict) else st
          return str(val).strip().lower() if val is not None else ""

      def post_unload(model_id):
          body = json.dumps({"model": model_id} if model_id else {}).encode("utf-8")
          headers = {**auth, "Content-Type": "application/json"}
          for path in ("/unload", "/v1/unload"):
              req = urllib.request.Request(f"{base}{path}", data=body, headers=headers, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      return resp.status
              except urllib.error.HTTPError as e:
                  if e.code in (404, 405):
                      continue
                  return e.code
          return 404

      deadline = time.time() + 1800
      unloaded_once = False
      empty_polls = 0

      while time.time() < deadline:
          try:
              models = get_models()
          except urllib.error.HTTPError as e:
              print(f"[unload] {base}/v1/models returned HTTP {e.code} (check STRATA_API_KEY)", flush=True)
              time.sleep(5)
              continue
          except Exception as e:
              print(f"[unload] waiting for {base}: {e}", flush=True)
              time.sleep(3)
              continue

          if not models:
              if unloaded_once:
                  print(f"[unload] {base} reports no loaded models; waiting 3s for CUDA release", flush=True)
                  time.sleep(3)
                  sys.exit(0)
              empty_polls += 1
              if empty_polls < 5:
                  print(f"[unload] {base} returned empty model list ({empty_polls}/5); waiting...", flush=True)
                  time.sleep(3)
                  continue
              code = post_unload("")
              print(f"[unload] POST unload <default> -> HTTP {code}", flush=True)
              unloaded_once = True
              time.sleep(3)
              continue

          empty_polls = 0
          states = [(m.get("id", ""), status_of(m)) for m in models]
          print(f"[unload] {base} states={states}", flush=True)

          if any(st in ("loading", "starting") for _, st in states):
              time.sleep(3)
              continue

          loaded = [mid for mid, st in states if st == "loaded"]
          missing_status = [mid for mid, st in states if st == ""]

          if not loaded and (unloaded_once or not missing_status):
              print(f"[unload] {base} is unloaded; waiting 3s for CUDA release", flush=True)
              time.sleep(3)
              sys.exit(0)

          targets = loaded or missing_status or [""]
          busy = False
          for mid in targets:
              code = post_unload(mid)
              print(f"[unload] POST unload {mid or '<default>'} -> HTTP {code}", flush=True)
              if code == 409:
                  busy = True
          if not busy:
              unloaded_once = True
          time.sleep(3)

      print(f"[unload] timed out waiting for {base} to unload", file=sys.stderr)
      sys.exit(1)

services:
  llamacpp:
    # image: ghcr.io/ggml-org/llama.cpp:server-cuda
    image: local/llama.cpp:server-cuda-inkling
    build:
      context: ./llamacpp-inkling
      dockerfile: Dockerfile
    container_name: llamacpp-server
    restart: unless-stopped
    ports:
      - "11434:8080"
    volumes:
      - ./models:/models
      - ./models.ini:/models.ini
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command:
      - "--api-key"
      - "${LLAMACPP_API_KEY}"
      - "--models-preset"
      - "/models.ini"
      - "--models-max"
      - "3"
      - "--timeout"
      - "3600"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--metrics"

  strata:
    image: ghcr.io/niko1221/strata:latest-cuda12
    container_name: strata
    restart: unless-stopped
    stop_grace_period: 2m
    ports:
      - "127.0.0.1:11435:11435"
    environment:
      - PORT=11435
      - FAMILY=qwen
      - MODEL=IQ2_XS          # or IQ3_XXS for 64 GB RAM
      - API_KEY=${STRATA_API_KEY:?Set STRATA_API_KEY in .env}
      - GPU_ROLES=0=main,1=helper
      - PARALLEL=1
      # - STRATA_SET=idle-unload=300   # optional: auto-unload after 5 min idle
    volumes:
      - strata-data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  strata-unload:
    <<: *strata-unloader
    container_name: strata-unload
    depends_on:
      strata:
        condition: service_started
    environment:
      - TARGET_URL=http://strata:11435
      - STRATA_API_KEY=${STRATA_API_KEY:?Set STRATA_API_KEY in .env}

  # strata-inkling:
  #   image: ghcr.io/niko1221/strata:latest-cuda12
  #   container_name: strata-inkling
  #   restart: unless-stopped
  #   stop_grace_period: 2m
  #   depends_on:
  #     strata-unload:
  #       condition: service_completed_successfully
  #   ports:
  #     - "127.0.0.1:11436:11436"
  #   environment:
  #     - PORT=11436
  #     - PRESET=docker-inkling
  #     - FAMILY=inkling-2-mini
  #     # - MODEL=SQ-10             # 10.47 GB — fits in RTX 3060 12 GB VRAM
  #     - MODEL=SQ-15           # 14.35 GB — spans RTX 3060 + GTX 1080
  #     - CONTEXT=128000
  #     # - CONTEXT=196608        # 192k fallback if VRAM/RAM gets tight
  #     - PARALLEL=1
  #     - KV=k8v4                 # or q4_0 for extra KV headroom
  #     - VISION=off
  #     - GPU_ROLES=0=main,1=helper
  #     - API_KEY=${STRATA_API_KEY:?Set STRATA_API_KEY in .env}
  #   volumes:
  #     - strata-data:/data
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]

  # strata-inkling-unload:
  #   <<: *strata-unloader
  #   container_name: strata-inkling-unload
  #   depends_on:
  #     strata-inkling:
  #       condition: service_started
  #   environment:
  #     - TARGET_URL=http://strata-inkling:11436
  #     - STRATA_API_KEY=${STRATA_API_KEY:?Set STRATA_API_KEY in .env}

  vram-router:
    image: python:3.12-slim
    container_name: vram-router
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir fastapi uvicorn httpx &&
             uvicorn router:app --host 0.0.0.0 --port 8080"
    ports:
      - "0.0.0.0:8090:8080"
    environment:
      - LLAMACPP_URL=http://llamacpp:8080
      - STRATA_URL=http://strata:11435
      - STRATA_URLS=http://strata:11435,http://strata-inkling:11436
      - MODELS_INI_PATH=/app/models.ini
      - MODEL_CONFIG_PATH=/app/model-config.json
      - LLAMACPP_API_KEY=${LLAMACPP_API_KEY}
      - STRATA_API_KEY=${STRATA_API_KEY:?Set STRATA_API_KEY in .env}
      - ROUTER_API_KEY=${ROUTER_API_KEY:?Set ROUTER_API_KEY in .env}
    volumes:
      - ./vram-router/router.py:/app/router.py:ro
      - ./vram-router/model-config.json:/app/model-config.json:ro
      - ./models.ini:/app/models.ini:ro

  comfyui:
    image: local/comfyui:0.36.0
    build:
      context: ./comfyui
      dockerfile: Dockerfile
    container_name: comfyui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8188:8188"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      # Persistent workflows, input files, and generated images
      - ./comfyui/workspace:/workspace

      # Existing Stable Diffusion model library
      - ./comfyui/workspace/storage/stable_diffusion/models:/opt/storage/stable_diffusion/models

      # Qwen Image 2.1 model storage
      - qwen_diffusion_models:/opt/ComfyUI/models/diffusion_models
      - qwen_text_encoders:/opt/ComfyUI/models/text_encoders
      - qwen_vae:/opt/ComfyUI/models/vae
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.13.4
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - open-webui_data:/app/backend/data
    environment:
      ENABLE_IMAGE_GENERATION: "true"
      IMAGE_GENERATION_ENGINE: "comfyui"
      COMFYUI_BASE_URL: "http://comfyui:8188/"
      COMFYUI_API_KEY: ${COMFYUI_API_KEY}
    depends_on:
      - llamacpp
      - comfyui

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: unless-stopped
    ports:
      - "0.0.0.0:4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./litellm/custom_callbacks.py:/app/custom_callbacks.py:ro
      - ./litellm/chatgpt:/tokens/chatgpt
    env_file:
      - .env
    environment:
      CHATGPT_TOKEN_DIR: /tokens/chatgpt
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
    networks:
      - default

volumes:
  open-webui_data:
  qwen_diffusion_models:
  qwen_text_encoders:
  qwen_vae:
  strata-data: