[*]
no-mmproj-offload = true
flash-attn = auto
n-gpu-layers = 999
split-mode = layer
jinja = true

[Ornith-1.5-35B-Q3]
model = /models/Ornith-1.5-35B-A3B-Q3_K_S.gguf
# Uncomment below if you also want vision support (stays in system RAM via no-mmproj-offload)
mmproj = /models/mmproj-Ornith-1.5-35B-A3B-f16.gguf
no-mmproj-offload = true
ctx-size = 131072
n-gpu-layers = 999
cache-type-k = q4_0
cache-type-v = f16
batch-size = 2048
ubatch-size = 128
tensor-split = 1,1
jinja = true
timeout = 3600

[Bonsai-2-27B]
model = /models/Ternary-Bonsai-2-27B-Q2_0.gguf
mmproj = /models/Ternary-Bonsai-2-27B-mmproj-Q8_0.gguf
no-mmproj-offload = true
ctx-size = 128000
n-gpu-layers = 999
split-mode = none
main-gpu = 0
tensor-split = 1,0
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
batch-size = 2048
ubatch-size = 512
jinja = true
timeout = 3600

# Official Prism ML recommended sampling (Thinking Mode)
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.05
presence-penalty = 0.0
repeat-penalty = 1.0

