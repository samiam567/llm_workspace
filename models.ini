[inkling-2-mini-gguf]

model = /models/Inkling-2-Mini-UD-IQ2_XXS.gguf_file
mmproj = /models/mmproj-F16-inkling-2-mini.gguf
ctx-size = 128000
cache-type-k = q4_0
cache-type-v = q4_0
# If mainline llama.cpp shows inflated VRAM with q8_0 KV on Inkling, switch K to q4_0:
flash-attn = on
batch-size = 2048
ubatch-size = 1024

n-gpu-layers = 99
split-mode = layer
# Places layers 0-17 (full 3x loop core) on GPU 0 (RTX 3060) and layers 18-23 on GPU 1 (GTX 1080)
tensor-split = 1,1

temp = 1.0
top-p = 1.0
top-k = 0
min-p = 0.0
n-cpu-moe = 10