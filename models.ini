[*]
no-mmproj-offload = true
flash-attn = auto

n-gpu-layers = 999
np = 2
jinja = true

[Ornith-1.5-35B-Q3]
model = /models/Ornith-1.5-35B-A3B-Q3_K_S.gguf
# Uncomment below if you also want vision support (stays in system RAM via no-mmproj-offload)
mmproj = /models/mmproj-Ornith-1.5-35B-A3B-f16.gguf
no-mmproj-offload = true
ctx-size = 131072
n-gpu-layers = 999
split-mode = layer
cache-type-k = q4_0
cache-type-v = f16
batch-size = 2048
ubatch-size = 128
jinja = true
timeout = 3600
tensor-split = 12,8

[Bonsai-2-27B]
model = /models/Ternary-Bonsai-2-27B-Q2_0.gguf
mmproj = /models/Ternary-Bonsai-2-27B-mmproj-Q8_0.gguf
no-mmproj-offload = true
ctx-size = 131072
n-gpu-layers = 999
split-mode = none
# Assumes RTX 3060 (12 GB) is CUDA0; change to main-gpu = 1 and tensor-split = 0,1 if CUDA1
main-gpu = 0
tensor-split = 1,0
flash-attn = on
cache-type-k = q4_0
cache-type-v = f16
batch-size = 2048
ubatch-size = 512
jinja = true
timeout = 3600

# Official Prism ML recommended sampling (Thinking Mode)
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.05
presence-penalty = 0.0
repeat-penalty = 1.0

[LFM3-1.7B]
model = /models/LFM3-1.7B-Q8_0.gguf
ctx-size = 131072
cache-type-k = q4_0
cache-type-v = f16

