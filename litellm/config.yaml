
model_list:
  # PRIORITY 1 — Google Gemini 3.8 Flash
  - model_name: coding-free
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GOOGLE_AI_STUDIO_API_KEY
      rpm: 5
      rpd: 20
      order: 1
      daily_reset_time: "07:00"
    model_info:
      allowed_fails_policy:
        RateLimitErrorAllowedFails: 0
        ServiceUnavailableErrorAllowedFails: 0
      cooldown_time: 60

