litellm_settings:
  num_retries: 0
  callbacks:
    - custom_callbacks.proxy_handler_instance


router_settings:
  enable_pre_call_checks: true
  optional_pre_call_checks:
    - enforce_model_rate_limits
  retry_policy:
    ServiceUnavailableErrorRetries: 0


general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
